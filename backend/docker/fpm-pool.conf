; Pool "www" ajustado para un VPS compartido (no dedicado a este contenedor).
; pm=dynamic: arranca con pocos workers y escala bajo demanda sin agotar RAM.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Logs a stdout/stderr para que Dokploy/Traefik los recoja con `docker logs`.
access.log = /proc/self/fd/1
catch_workers_output = yes
decorate_workers_output = no
