events {
    worker_connections 1024;
}

http {
    # Standard MIME type table — maps .js → application/javascript, .css → text/css, etc.
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    charset utf-8;
    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Compress text-based assets before sending
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # ── SPA routing ───────────────────────────────────────────────────────
        # Any path that does not match a real file falls back to index.html
        # so that React Router can handle the route client-side.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Hashed static assets ─────────────────────────────────────────────
        # Vite appends a content hash to every JS/CSS filename, so a 1-year
        # immutable cache is safe — a changed file always has a different URL.
        location ~* \.(js|mjs|css|woff2|woff|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── HTML files ────────────────────────────────────────────────────────
        # index.html must never be cached so the browser always gets the
        # latest asset hashes after a new deployment.
        location ~* \.html?$ {
            expires    -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
